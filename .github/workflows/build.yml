name: Build PDF2Word

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: PDF2Word-windows-exe
            artifact_path: dist/PDF2Word.exe
          - os: macos-14  # Apple Silicon (arm64) runner
            artifact_name: PDF2Word-macos-app
            artifact_path: dist/PDF2Word.app

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-build.txt') }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: pyinstaller pdf2word.spec --noconfirm --clean

      # --- macOS: produce a DMG for release distribution ------------------
      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname PDF2Word \
            -srcfolder dist/PDF2Word.app \
            -ov -format UDZO dist/PDF2Word.dmg

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: PDF2Word-macos-dmg
          path: dist/PDF2Word.dmg

      # --- Upload raw bundle (Windows: single .exe, macOS: .app folder) ---
      - name: Upload raw bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}

  # Attach artifacts to a GitHub Release when a tag like v1.0.0 is pushed.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PDF2Word-macos-dmg/PDF2Word.dmg
            artifacts/PDF2Word-windows-exe/PDF2Word.exe
          generate_release_notes: true
